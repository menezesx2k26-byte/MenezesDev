name: MenezesDev Studio Capture Phase10 Equivalence

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio
          path: studio

      - name: Checkout Phase 10 baseline
        uses: actions/checkout@v7
        with:
          ref: 152fab910296f29cfae2e07bf6ccc2c69f0ce0df
          path: baseline

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install and build Phase 10
        working-directory: baseline
        env:
          PUBLIC_SITE_URL: http://127.0.0.1:4324
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build:site

      - name: Capture semantic Phase 10 fixture
        run: node studio/scripts/check-public-equivalence.mjs capture-static baseline/dist studio/tests/fixtures/public-equivalence-phase10.json

      - name: Guard and commit exact fixture
        working-directory: studio
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git status --short | awk '{print $2}' | sort)
          expected='tests/fixtures/public-equivalence-phase10.json'
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/public-equivalence-phase10.json
          staged=$(git diff --cached --name-only | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$staged")
          git commit -m "test(studio): capture Phase 10 public equivalence fixture"
          git push origin HEAD:feat/menezesdev-studio
