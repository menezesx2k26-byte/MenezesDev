name: MenezesDev Studio Extract Home Renderer

on:
  push:
    branches:
      - feat/menezesdev-studio
    paths:
      - .github/workflows/studio-extract-home-renderer.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Extract shared Home renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("src/pages/index.astro")
          source = source_path.read_text()
          if not source.startswith("---\n"):
              raise SystemExit("Unexpected Home frontmatter start")
          end = source.find("\n---\n", 4)
          if end < 0:
              raise SystemExit("Unexpected Home frontmatter end")
          front = source[4:end]
          body = source[end + 5:]
          marker = "const splitFirstSentence"
          helper_at = front.find(marker)
          if helper_at < 0:
              raise SystemExit("Home helpers marker missing")
          helpers = front[helper_at:].rstrip()

          renderer_front = '''---
          import BaseLayout from "../../layouts/BaseLayout.astro";
          import MenezesHeader from "../MenezesHeader.astro";
          import MenezesFooter from "../MenezesFooter.astro";
          import CommercialAction from "../CommercialAction.astro";
          import { ArrowRight, Check } from "lucide-astro";
          import { toPublicHomeView } from "../../studio/public-content";
          import type { SiteDocument } from "../../studio/types";
          import "../../styles/menezesdev.css";

          interface Props {
            document: SiteDocument;
            preview?: boolean;
          }

          const { document, preview = false } = Astro.props;
          const view = toPublicHomeView(document);
          const navigation = view.navigation.map(({ label, href }) => ({ label, href }));
          const commercialHref = preview ? null : view.whatsappUrl;

          '''.replace("          ", "")

          renderer_body = body
          renderer_body = renderer_body.replace(
              '  preloadFont="--font-manrope"\n>',
              '  preloadFont="--font-manrope"\n  noindex={preview}\n>',
              1,
          )
          renderer_body = renderer_body.replace(
              'whatsappUrl={view.whatsappUrl}',
              'whatsappUrl={commercialHref}',
          )
          renderer_body = renderer_body.replace(
              'href={view.whatsappUrl}',
              'href={commercialHref}',
          )
          old_project_link = 'href={`/projetos/${project.slug}`}'
          new_project_link = 'href={preview ? `/admin/preview/projetos/${project.id}` : `/projetos/${project.slug}`}'
          if old_project_link not in renderer_body:
              raise SystemExit("Home project link marker missing")
          renderer_body = renderer_body.replace(old_project_link, new_project_link, 1)
          header_marker = '  <MenezesHeader\n'
          if header_marker not in renderer_body:
              raise SystemExit("Home header marker missing")
          banner = '''  {preview && (
            <aside class="draft-preview-banner" role="status" aria-label="Prévia do rascunho">
              Prévia do rascunho — não publicada
            </aside>
          )}
          '''.replace("          ", "")
          renderer_body = renderer_body.replace(header_marker, banner + header_marker, 1)

          renderer = renderer_front + helpers + "\n---\n" + renderer_body
          renderer_path = Path("src/components/menezesdev/HomePage.astro")
          renderer_path.parent.mkdir(parents=True, exist_ok=True)
          renderer_path.write_text(renderer)

          wrapper = '''---
          import HomePage from "../components/menezesdev/HomePage.astro";
          import { getRuntimeBindings } from "../runtime/bindings";
          import { getPublishedSiteDocument } from "../studio/public-content";

          const { DB } = getRuntimeBindings();
          const document = await getPublishedSiteDocument(DB);
          ---

          <HomePage document={document} />
          '''.replace("          ", "")
          source_path.write_text(wrapper)
          PY

      - name: Guard file scope
        shell: bash
        run: |
          set -euo pipefail
          actual=$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=$(printf '%s\n' \
            'src/components/menezesdev/HomePage.astro' \
            'src/pages/index.astro' | sort -u)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$actual"
            exit 1
          fi

      - name: Commit extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/menezesdev/HomePage.astro src/pages/index.astro
          git commit -m "refactor(studio): extract shared Home renderer"
          git push origin HEAD:feat/menezesdev-studio
