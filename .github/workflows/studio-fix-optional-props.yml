name: MenezesDev Studio Fix Optional Props

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Permit explicitly undefined optional Astro props
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/components/MenezesHeader.astro'): [
                  ('navigation?: NavigationItem[];', 'navigation?: NavigationItem[] | undefined;'),
                  ('whatsappUrl?: string | null;', 'whatsappUrl?: string | null | undefined;'),
              ],
              Path('src/components/MenezesFooter.astro'): [
                  ('navigation?: NavigationItem[];', 'navigation?: NavigationItem[] | undefined;'),
                  ('whatsappUrl?: string | null;', 'whatsappUrl?: string | null | undefined;'),
              ],
              Path('src/layouts/BaseLayout.astro'): [
                  ('image?: string;', 'image?: string | undefined;'),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected exactly one {old!r} in {path}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          corepack pnpm exec prettier --write src/components/MenezesHeader.astro src/components/MenezesFooter.astro src/layouts/BaseLayout.astro
          corepack pnpm check

      - name: Guard and commit exact type fix
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/components/MenezesHeader.astro src/components/MenezesFooter.astro src/layouts/BaseLayout.astro | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MenezesHeader.astro src/components/MenezesFooter.astro src/layouts/BaseLayout.astro
          staged=$(git diff --cached --name-only | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$staged")
          git commit -m "fix(studio): satisfy exact optional public props"
          git push origin HEAD:feat/menezesdev-studio
