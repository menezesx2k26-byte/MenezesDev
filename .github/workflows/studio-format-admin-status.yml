name: MenezesDev Studio Format Admin Status

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Format AdminStatus
        run: corepack pnpm exec prettier --write src/components/admin/AdminStatus.astro
      - name: Guard and commit exact file
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only)
          test "$actual" = "src/components/admin/AdminStatus.astro"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminStatus.astro
          staged=$(git diff --cached --name-only)
          test "$staged" = "src/components/admin/AdminStatus.astro"
          git commit -m "style(studio): format admin status"
          git push origin HEAD:feat/menezesdev-studio
