name: MenezesDev Studio Format Default Document

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Format exact default document files
        run: corepack pnpm exec prettier --write src/studio/default-document.ts tests/studio/default-document.test.ts

      - name: Guard and commit exact default document files
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/studio/default-document.ts tests/studio/default-document.test.ts | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/studio/default-document.ts tests/studio/default-document.test.ts
          staged=$(git diff --cached --name-only | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$staged")
          git commit -m "style(studio): format default editorial document"
          git push origin HEAD:feat/menezesdev-studio
