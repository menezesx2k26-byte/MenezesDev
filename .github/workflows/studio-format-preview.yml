name: MenezesDev Studio Format Preview

on:
  push:
    branches:
      - feat/menezesdev-studio
    paths:
      - .github/workflows/studio-format-preview.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Format exact preview files
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/prettier --write \
            src/components/admin/PreviewFrame.astro \
            src/components/menezesdev/HomePage.astro \
            'src/pages/admin/preview/projetos/[id].astro' \
            tests/admin/preview.test.ts

      - name: Guard file scope
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | sort -u)
          expected=$(printf '%s\n' \
            'src/components/admin/PreviewFrame.astro' \
            'src/components/menezesdev/HomePage.astro' \
            'src/pages/admin/preview/projetos/[id].astro' \
            'tests/admin/preview.test.ts' | sort -u)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$actual"
            exit 1
          fi

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/admin/PreviewFrame.astro \
            src/components/menezesdev/HomePage.astro \
            'src/pages/admin/preview/projetos/[id].astro' \
            tests/admin/preview.test.ts
          git commit -m "style(studio): format draft preview"
          git push origin HEAD:feat/menezesdev-studio
