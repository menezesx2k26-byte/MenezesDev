name: MenezesDev Studio Format SEO Settings

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Show formatted TDD workflow
        run: corepack pnpm exec prettier .github/workflows/studio-tdd.yml

      - name: Format exact Task 7 source files
        run: >-
          corepack pnpm exec prettier --write
          src/components/admin/seo/SeoEditor.astro
          src/components/admin/settings/SettingsEditor.astro
          src/pages/admin/configuracoes.astro
          src/pages/admin/seo.astro
          src/studio/client/seo-settings-controller.ts
          src/studio/url-policy.ts
          tests/admin/seo-settings.test.ts

      - name: Guard and commit exact files
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/components/admin/seo/SeoEditor.astro \
            src/components/admin/settings/SettingsEditor.astro \
            src/pages/admin/configuracoes.astro \
            src/pages/admin/seo.astro \
            src/studio/client/seo-settings-controller.ts \
            src/studio/url-policy.ts \
            tests/admin/seo-settings.test.ts | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/admin/seo/SeoEditor.astro \
            src/components/admin/settings/SettingsEditor.astro \
            src/pages/admin/configuracoes.astro \
            src/pages/admin/seo.astro \
            src/studio/client/seo-settings-controller.ts \
            src/studio/url-policy.ts \
            tests/admin/seo-settings.test.ts
          git commit -m "style(studio): format SEO and settings management"
          git push origin HEAD:feat/menezesdev-studio
