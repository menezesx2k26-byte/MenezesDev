name: MenezesDev Studio Format Services Plans

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Update valid schema fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/studio/validation.test.ts')
          source = path.read_text()
          old = '''          text: "Apresente sua empresa e seus serviços.",
                    microcopy: "Ideal para empresas e profissionais.",'''
          new = '''          text: "Apresente sua empresa e seus serviços.",
                    microcopy: "Ideal para empresas e profissionais.",
                    visible: true,'''
          if old not in source:
              raise SystemExit('expected service fixture not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Format exact Task 6 files
        run: >-
          corepack pnpm exec prettier --write
          src/components/admin/plans/PlansEditor.astro
          src/components/admin/services/ServicesEditor.astro
          src/pages/admin/planos.astro
          src/pages/admin/servicos.astro
          src/studio/client/services-plans-controller.ts
          src/studio/validation.ts
          tests/admin/services-plans.test.ts
          tests/studio/validation.test.ts

      - name: Guard and commit exact files
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/components/admin/plans/PlansEditor.astro \
            src/components/admin/services/ServicesEditor.astro \
            src/pages/admin/planos.astro \
            src/pages/admin/servicos.astro \
            src/studio/client/services-plans-controller.ts \
            src/studio/validation.ts \
            tests/admin/services-plans.test.ts \
            tests/studio/validation.test.ts | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/admin/plans/PlansEditor.astro \
            src/components/admin/services/ServicesEditor.astro \
            src/pages/admin/planos.astro \
            src/pages/admin/servicos.astro \
            src/studio/client/services-plans-controller.ts \
            src/studio/validation.ts \
            tests/admin/services-plans.test.ts \
            tests/studio/validation.test.ts
          git commit -m "style(studio): format services and plans management"
          git push origin HEAD:feat/menezesdev-studio
