name: MenezesDev Studio Format Two Files

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Format exact files
        run: corepack pnpm exec prettier --write scripts/route-contract.mjs tests/runtime/route-contract.test.ts

      - name: Guard and commit exact files
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | sort)
          if [ -z "$actual" ]; then
            echo "Files already canonical."
            exit 0
          fi
          expected=$(printf '%s\n' scripts/route-contract.mjs tests/runtime/route-contract.test.ts | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/route-contract.mjs tests/runtime/route-contract.test.ts
          git commit -m "style(studio): apply canonical Prettier formatting"
          git push origin HEAD:feat/menezesdev-studio
