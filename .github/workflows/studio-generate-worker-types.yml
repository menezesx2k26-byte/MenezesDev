name: MenezesDev Studio Generate Worker Types

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Wrangler binding types
        run: corepack pnpm cf:types

      - name: Validate generated binding surface
        shell: bash
        run: |
          set -euo pipefail
          test -f worker-configuration.d.ts
          grep -Eq '\bDB[[:space:]]*:[[:space:]]*D1Database\b' worker-configuration.d.ts
          grep -Eq '\bMEDIA[[:space:]]*:[[:space:]]*R2Bucket\b' worker-configuration.d.ts
          if grep -Eq '\b(IMAGES|SESSION)[[:space:]]*:' worker-configuration.d.ts; then
            echo "Unexpected implicit binding type found."
            exit 1
          fi
          actual=$(git diff --name-only | sort)
          expected='worker-configuration.d.ts'
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Commit generated types
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-configuration.d.ts
          staged=$(git diff --cached --name-only)
          test "$staged" = "worker-configuration.d.ts"
          git commit -m "chore(studio): generate Cloudflare binding types"
          git push origin HEAD:feat/menezesdev-studio
