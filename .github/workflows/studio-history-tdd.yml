name: MenezesDev Studio History TDD

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: read

jobs:
  history:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: History contract
        run: corepack pnpm test -- tests/admin/history.test.ts
