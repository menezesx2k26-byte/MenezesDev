name: MenezesDev Studio Lockfile Artifact

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: read

concurrency:
  group: menezesdev-studio-lock-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Generate lockfile
        run: corepack pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: studio-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
