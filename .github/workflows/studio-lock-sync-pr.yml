name: MenezesDev Studio Lockfile Sync PR

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

concurrency:
  group: menezesdev-studio-lock-sync-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Regenerate lockfile only
        run: corepack pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit only pnpm-lock.yaml when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          CHANGED="$(git diff --cached --name-only)"
          test "$CHANGED" = "pnpm-lock.yaml"
          git commit -m "chore(studio): sync pnpm lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
