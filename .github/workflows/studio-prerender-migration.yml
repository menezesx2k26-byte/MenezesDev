name: MenezesDev Studio Prerender Migration

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

concurrency:
  group: menezesdev-studio-prerender-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head branch
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Apply guarded hybrid-runtime migration
        shell: python
        run: |
          from pathlib import Path

          static_pages = [
              "src/pages/demo/m47.astro",
              "src/pages/demo/prismae/contact.astro",
              "src/pages/demo/prismae/index.astro",
              "src/pages/demo/prismae/solutions/index.astro",
              "src/pages/demo/prismae/solutions/indicators.astro",
              "src/pages/demo/prismae/solutions/processes.astro",
              "src/pages/demo/prismae/solutions/strategy.astro",
              "src/pages/demo/tavola27/contact.astro",
              "src/pages/demo/tavola27/gallery.astro",
              "src/pages/demo/tavola27/index.astro",
              "src/pages/demo/tavola27/menu.astro",
              "src/pages/demo/tavola27/storia.astro",
              "src/pages/404.astro",
          ]

          for path_string in static_pages:
              path = Path(path_string)
              text = path.read_text(encoding="utf-8")
              if "export const prerender" in text:
                  continue
              if not text.startswith("---\n"):
                  raise SystemExit(f"Unexpected Astro frontmatter in {path_string}")
              path.write_text(
                  text.replace("---\n", "---\nexport const prerender = true;\n\n", 1),
                  encoding="utf-8",
              )

          config_path = Path("astro.config.mjs")
          config = config_path.read_text(encoding="utf-8")
          if 'import cloudflare from "@astrojs/cloudflare";' not in config:
              marker = 'import sitemap from "@astrojs/sitemap";'
              if marker not in config:
                  raise SystemExit("Astro config import anchor changed")
              config = config.replace(
                  marker,
                  'import cloudflare from "@astrojs/cloudflare";\n' + marker,
                  1,
              )
          if 'output: "static",' in config:
              config = config.replace(
                  'output: "static",',
                  'output: "server",\n  adapter: cloudflare(),',
                  1,
              )
          elif 'output: "server",' not in config or 'adapter: cloudflare(),' not in config:
              raise SystemExit("Astro output configuration changed unexpectedly")
          config_path.write_text(config, encoding="utf-8")

      - name: Verify exact mutation scope
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF' | sort
          astro.config.mjs
          src/pages/404.astro
          src/pages/demo/m47.astro
          src/pages/demo/prismae/contact.astro
          src/pages/demo/prismae/index.astro
          src/pages/demo/prismae/solutions/index.astro
          src/pages/demo/prismae/solutions/indicators.astro
          src/pages/demo/prismae/solutions/processes.astro
          src/pages/demo/prismae/solutions/strategy.astro
          src/pages/demo/tavola27/contact.astro
          src/pages/demo/tavola27/gallery.astro
          src/pages/demo/tavola27/index.astro
          src/pages/demo/tavola27/menu.astro
          src/pages/demo/tavola27/storia.astro
          EOF
          )
          actual=$(git diff --name-only | sort)
          if [ -z "$actual" ]; then
            echo "Migration already applied; nothing to commit."
            exit 0
          fi
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Commit guarded migration when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro.config.mjs src/pages/404.astro src/pages/demo
          staged=$(git diff --cached --name-only | sort)
          expected=$(cat <<'EOF' | sort
          astro.config.mjs
          src/pages/404.astro
          src/pages/demo/m47.astro
          src/pages/demo/prismae/contact.astro
          src/pages/demo/prismae/index.astro
          src/pages/demo/prismae/solutions/index.astro
          src/pages/demo/prismae/solutions/indicators.astro
          src/pages/demo/prismae/solutions/processes.astro
          src/pages/demo/prismae/solutions/strategy.astro
          src/pages/demo/tavola27/contact.astro
          src/pages/demo/tavola27/gallery.astro
          src/pages/demo/tavola27/index.astro
          src/pages/demo/tavola27/menu.astro
          src/pages/demo/tavola27/storia.astro
          EOF
          )
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$staged")
          git commit -m "feat(studio): migrate Astro runtime to Cloudflare"
          git push origin HEAD:feat/menezesdev-studio
