name: MenezesDev Studio Prettier Dump

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: read

jobs:
  dump:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Dump formatted TDD workflow
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm exec prettier .github/workflows/studio-tdd.yml > /tmp/studio-tdd.formatted.yml
          echo 'FORMATTED_BASE64_BEGIN'
          base64 -w0 /tmp/studio-tdd.formatted.yml
          echo
          echo 'FORMATTED_BASE64_END'
