name: MenezesDev Studio Project Disclosure Patch

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Enforce demo disclosure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/studio/validation.ts')
          source = path.read_text()
          old = '''    requireString(project, "name", `projects[${index}].name`, issues, { nonEmpty: true });
              requireString(project, "disclosure", `projects[${index}].disclosure`, issues, {
                nonEmpty: true,
              });
              validateHref(project, "demoHref", `projects[${index}].demoHref`, issues);'''
          new = '''    requireString(project, "name", `projects[${index}].name`, issues, { nonEmpty: true });
              const disclosure = requireString(
                project,
                "disclosure",
                `projects[${index}].disclosure`,
                issues,
                { nonEmpty: true },
              );
              if (
                typeof project.demoHref === "string" &&
                project.demoHref.startsWith("/demo/") &&
                disclosure !== "Conceito demonstrativo"
              ) {
                addIssue(
                  issues,
                  `projects[${index}].disclosure`,
                  "demo_disclosure",
                  "Demo-linked cases must remain labeled as Conceito demonstrativo.",
                );
              }
              validateHref(project, "demoHref", `projects[${index}].demoHref`, issues);'''
          if old not in source:
              raise SystemExit('expected validation snippet not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Guard and commit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only)
          test "$actual" = "src/studio/validation.ts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/studio/validation.ts
          git commit -m "fix(studio): enforce demo case disclosure"
          git push origin HEAD:feat/menezesdev-studio
