name: MenezesDev Studio SEO Settings Policy Patch

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Enforce external URL policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/studio/validation.ts')
          source = path.read_text()
          old_import = '''import { formatPlanStartingPrice } from "./pricing";\nimport { SITE_DOCUMENT_SCHEMA_VERSION } from "./types";'''
          new_import = '''import { formatPlanStartingPrice } from "./pricing";\nimport { isAllowedSocialUrl, isApprovedWhatsappUrl } from "./url-policy";\nimport { SITE_DOCUMENT_SCHEMA_VERSION } from "./types";'''
          if old_import not in source:
              raise SystemExit('validation import anchor not found')
          source = source.replace(old_import, new_import, 1)

          old = '''const validateCommercial = (root: UnknownRecord, issues: StudioValidationIssue[]): void => {\n  const commercial = recordAt(root, "commercial", "commercial", issues);\n  if (!commercial) return;\n  validateHref(commercial, "whatsappUrl", "commercial.whatsappUrl", issues, { nullable: true });\n  requireString(commercial, "whatsappMessage", "commercial.whatsappMessage", issues);\n  const links = arrayAt(commercial, "socialLinks", "commercial.socialLinks", issues);\n  validateIdList(links, "commercial.socialLinks", issues);\n  links.forEach((link, index) => {\n    if (!isRecord(link)) return;\n    validateHref(link, "href", `commercial.socialLinks[${index}].href`, issues);\n  });\n};'''
          new = '''const validateCommercial = (root: UnknownRecord, issues: StudioValidationIssue[]): void => {\n  const commercial = recordAt(root, "commercial", "commercial", issues);\n  if (!commercial) return;\n  const whatsappUrl = commercial.whatsappUrl;\n  if (whatsappUrl !== null && typeof whatsappUrl !== "string") {\n    addIssue(issues, "commercial.whatsappUrl", "type", "Expected a string or null.");\n  } else if (!isApprovedWhatsappUrl(whatsappUrl as string | null)) {\n    addIssue(\n      issues,\n      "commercial.whatsappUrl",\n      "whatsapp_url",\n      "WhatsApp must use an approved HTTPS wa.me or api.whatsapp.com destination.",\n    );\n  }\n  requireString(commercial, "whatsappMessage", "commercial.whatsappMessage", issues);\n  const links = arrayAt(commercial, "socialLinks", "commercial.socialLinks", issues);\n  validateIdList(links, "commercial.socialLinks", issues);\n  links.forEach((link, index) => {\n    if (!isRecord(link)) return;\n    requireString(link, "label", `commercial.socialLinks[${index}].label`, issues, {\n      nonEmpty: true,\n      max: STUDIO_LIMITS.shortText,\n    });\n    const href = link.href;\n    if (typeof href !== "string" || !isAllowedSocialUrl(href)) {\n      addIssue(\n        issues,\n        `commercial.socialLinks[${index}].href`,\n        "social_url",\n        "Social links must be absolute HTTP or HTTPS URLs.",\n      );\n    }\n  });\n};'''
          if old not in source:
              raise SystemExit('validateCommercial anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Guard and commit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only)
          test "$actual" = "src/studio/validation.ts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/studio/validation.ts
          git commit -m "feat(studio): enforce external URL policy"
          git push origin HEAD:feat/menezesdev-studio
