name: MenezesDev Studio Services Plans Schema Patch

on:
  pull_request:
    branches:
      - feat/phase-10-implementation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/menezesdev-studio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Studio head
        uses: actions/checkout@v7
        with:
          ref: feat/menezesdev-studio

      - name: Patch bounded Studio schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              source = file.read_text()
              if old not in source:
                  raise SystemExit(f'expected snippet not found in {path}')
              file.write_text(source.replace(old, new, 1))

          replace(
              'src/studio/types.ts',
              '''export interface StudioService {
            id: string;
            title: string;
            text: string;
            microcopy?: string;
          }''',
              '''export interface StudioService {
            id: string;
            title: string;
            text: string;
            microcopy?: string;
            visible: boolean;
          }''',
          )

          replace(
              'src/studio/default-document.ts',
              '''          text: service.text,
                    ...(service.microcopy ? { microcopy: service.microcopy } : {}),''',
              '''          text: service.text,
                    ...(service.microcopy ? { microcopy: service.microcopy } : {}),
                    visible: true,''',
          )

          replace(
              'src/studio/public-content.ts',
              '''    services: document.home.services.items,''',
              '''    services: document.home.services.items.filter((service) => service.visible),''',
          )

          replace(
              'src/studio/validation.ts',
              '''import { SITE_DOCUMENT_SCHEMA_VERSION } from "./types";''',
              '''import { formatPlanStartingPrice } from "./pricing";
          import { SITE_DOCUMENT_SCHEMA_VERSION } from "./types";''',
          )

          replace(
              'src/studio/validation.ts',
              '''  const serviceItems = arrayAt(services, "items", "home.services.items", issues);
            validateIdList(serviceItems, "home.services.items", issues);

            const process = recordAt(home, "process", "home.process", issues);''',
              '''  const serviceItems = arrayAt(services, "items", "home.services.items", issues);
            validateIdList(serviceItems, "home.services.items", issues);
            serviceItems.forEach((item, index) => {
              if (!isRecord(item)) return;
              requireBoolean(item, "visible", `home.services.items[${index}].visible`, issues);
            });
            if (
              services?.visible === true &&
              !serviceItems.some((item) => isRecord(item) && item.visible === true)
            ) {
              addIssue(
                issues,
                "home.services.items",
                "empty_visible_section",
                "A visible services section requires at least one visible service.",
              );
            }

            const process = recordAt(home, "process", "home.process", issues);''',
          )

          replace(
              'src/studio/validation.ts',
              '''  planItems.forEach((item, index) => {
              if (!isRecord(item)) {
                addIssue(issues, `home.plans.items[${index}]`, "type", "Expected a plan.");
                return;
              }
              const price = item.startingPriceCents;
              if (price !== null && (!Number.isInteger(price) || Number(price) < 0)) {
                addIssue(
                  issues,
                  `home.plans.items[${index}].startingPriceCents`,
                  "price",
                  "Price must be null or a non-negative integer in cents.",
                );
              }
              requireString(item, "priceLabel", `home.plans.items[${index}].priceLabel`, issues);
            });
            recordAt(plans, "custom", "home.plans.custom", issues);''',
              '''  planItems.forEach((item, index) => {
              if (!isRecord(item)) {
                addIssue(issues, `home.plans.items[${index}]`, "type", "Expected a plan.");
                return;
              }
              const visible = requireBoolean(
                item,
                "visible",
                `home.plans.items[${index}].visible`,
                issues,
              );
              requireBoolean(
                item,
                "recommended",
                `home.plans.items[${index}].recommended`,
                issues,
              );
              requireString(item, "ctaLabel", `home.plans.items[${index}].ctaLabel`, issues, {
                nonEmpty: visible === true,
              });
              const price = item.startingPriceCents;
              const validPrice =
                price === null || (Number.isInteger(price) && Number(price) >= 0);
              if (!validPrice) {
                addIssue(
                  issues,
                  `home.plans.items[${index}].startingPriceCents`,
                  "price",
                  "Price must be null or a non-negative integer in cents.",
                );
              }
              const priceLabel = requireString(
                item,
                "priceLabel",
                `home.plans.items[${index}].priceLabel`,
                issues,
              );
              if (
                validPrice &&
                priceLabel !== null &&
                priceLabel !== formatPlanStartingPrice(price as number | null)
              ) {
                addIssue(
                  issues,
                  `home.plans.items[${index}].priceLabel`,
                  "price_label",
                  "Price label must match the structured starting price.",
                );
              }
            });
            if (
              plans?.visible === true &&
              !planItems.some((item) => isRecord(item) && item.visible === true)
            ) {
              addIssue(
                issues,
                "home.plans.items",
                "empty_visible_section",
                "A visible plans section requires at least one visible plan.",
              );
            }
            if (
              planItems.filter((item) => isRecord(item) && item.recommended === true).length > 1
            ) {
              addIssue(
                issues,
                "home.plans.items",
                "recommended_limit",
                "At most one plan can be recommended.",
              );
            }
            recordAt(plans, "custom", "home.plans.custom", issues);''',
          )
          PY

      - name: Guard and commit exact files
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/studio/default-document.ts \
            src/studio/public-content.ts \
            src/studio/types.ts \
            src/studio/validation.ts | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/studio/default-document.ts src/studio/public-content.ts src/studio/types.ts src/studio/validation.ts
          git commit -m "feat(studio): enforce services and plans rules"
          git push origin HEAD:feat/menezesdev-studio
